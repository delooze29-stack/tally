name: Reset a password

# For when a player forgets their password: type their nickname and a new password, then Run.
# The password is hidden from the logs. Tell the player, and they can change it in the game
# (trophy button → Change password).
on:
  workflow_dispatch:
    inputs:
      nickname:
        description: 'Player nickname'
        required: true
      new_password:
        description: 'New password (6+ characters). Hidden from the logs.'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hide the password
        run: |
          PW=$(jq -r '.inputs.new_password' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$PW"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        working-directory: notify
        run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - name: Reset
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NICKNAME: ${{ github.event.inputs.nickname }}
          NEW_PASSWORD: ${{ github.event.inputs.new_password }}
        run: node reset.mjs
