name: Rules test
on:
  push:
    branches: [rules-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install
        working-directory: ruletest
        run: |
          cp ../firestore.rules .
          npm install --no-audit --no-fund firebase-tools@13.29.1 @firebase/rules-unit-testing@3.0.4 firebase@10.12.2
      - name: Run rules tests
        working-directory: ruletest
        run: |
          npx firebase emulators:exec --only firestore --project demo-tally "node rules.test.mjs" > emu.log 2>&1 || echo "EMULATOR ERROR" >> results.txt
          grep -v "^\s*$" emu.log | grep -iv "deprecat" | tail -12 | while read -r line; do echo "::warning title=LOG::${line}"; done
      - name: Report results
        working-directory: ruletest
        run: |
          head -1 results.txt | sed 's/^/::notice title=SUMMARY::/'
          grep '^FAIL' results.txt | head -40 | while read -r line; do echo "::warning title=T::${line}"; done
          echo "::notice title=FAILNAMES::$(grep '^FAIL' results.txt | sed 's/ ::.*//; s/^FAIL //' | tr '\n' '|')"
          grep -c '^PASS' results.txt | sed 's/^/::notice title=PASSCOUNT::/'
