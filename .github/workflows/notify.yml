name: Tally notifications

# Every 15 minutes GitHub runs notify/notify.mjs, which sends any notifications that are due.
# Until the FIREBASE_SERVICE_ACCOUNT secret is added, it just stops straight away.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_nickname:
        description: 'Send a test notification to this nickname (leave blank for a normal run)'
        required: false

concurrency:
  group: tally-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check notifications are set up
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "ready=no" >> "$GITHUB_OUTPUT"; echo "Not set up yet - nothing to do."; else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'yes'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'yes'
        with:
          node-version: 20

      - name: Install
        if: steps.check.outputs.ready == 'yes'
        working-directory: notify
        run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0

      - name: Send notifications
        if: steps.check.outputs.ready == 'yes'
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_NICKNAME: ${{ github.event.inputs.test_nickname }}
          # Links in notifications open the beta while we're testing. Set to '' when it goes live.
          TALLY_PATH: 'beta/'
        run: node notify.mjs
