<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<meta name="description" content="Tally: crack the daily 5-digit code in 7 guesses. Daily maths clue, points leaderboard.">
<meta property="og:title" content="Tally">
<meta property="og:description" content="Crack today's 5-digit code in 7 guesses. Can you beat my score?">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">

<style>
/* Layout: one-screen phone app: header, clue slip, 7x5 board on a dark panel, number pad at the bottom */
:root{
  --bg:#edf0f4; --surface:#ffffff; --ink:#151a23; --muted:#5b6475; --line:#c6cdd8; --empty:#d6dde7;
  --hit:#22915d; --near:#d4951a; --miss:#5f6a7e; --on:#ffffff; --accent:#2747c4; --bad:#c23b3b;
  --panel:#1c2431; --slot:#283244; --slotline:#3d4960; --typed:#f5f7fb; --typedink:#151a23;
  --shade:rgba(20,30,50,.07); --scrim:rgba(15,20,30,.45);
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --mono:"Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10141b; --surface:#1a2029; --ink:#e7ebf2; --muted:#97a0b1; --line:#2f3745; --empty:#283041;
  --hit:#2aa76c; --near:#dca23a; --miss:#4f596c; --on:#ffffff; --accent:#8299ff; --bad:#ef6b6b;
  --panel:#1b222d; --slot:#252e3c; --slotline:#3a4559; --typed:#eef1f6; --typedink:#151a23;
  --shade:rgba(0,0,0,.28); --scrim:rgba(0,0,0,.6); color-scheme:dark}}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:8px 12px;
  --key:clamp(40px, 6.2dvh, 52px);
  --tile:max(30px, min(54px, calc((100vw - 88px) / 5), calc((100dvh - 3 * var(--key) - 250px) / 7)))}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.titlerow{display:flex;align-items:center;gap:8px}
.brand h1{margin:0;font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.beta{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--near);color:var(--on);padding:2px 6px;border-radius:5px;align-self:center}
.sub{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px;flex-shrink:0}
.icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.clue{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--surface);border:1px dashed var(--line)}
.clue-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.clue-text{font-weight:600;font-size:15px;min-width:0;flex:1}
.clock{font-family:var(--mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.clock.run{color:var(--ink)}
.clock.done{color:var(--hit)}
.clue.practice .clue-label{color:var(--near)}
.cluebtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px;color:var(--ink)}
.cluebtn span{color:var(--bad);font-family:var(--mono);font-size:12px;margin-left:4px}

.board-wrap{flex:1;min-height:0;display:grid;place-items:center}
.board{display:grid;gap:6px;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--slotline)}
.row{display:grid;grid-template-columns:repeat(5, var(--tile));gap:6px}
.tile{position:relative;width:var(--tile);height:var(--tile);border-radius:7px;border:2px solid var(--slotline);color:var(--typedink);
  background:linear-gradient(rgba(0,0,0,.18), transparent 28%, transparent 72%, rgba(0,0,0,.18)), var(--slot);
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:calc(var(--tile) * .5);font-variant-numeric:tabular-nums;user-select:none}
.tile.typed{border-color:var(--typed);color:var(--typedink);background:linear-gradient(rgba(0,0,0,.08), transparent 28%, transparent 72%, rgba(0,0,0,.08)), var(--typed)}
.tile.hit,.tile.near,.tile.miss{color:var(--on)}
.tile.hit{background:linear-gradient(var(--shade), transparent 28%, transparent 72%, var(--shade)), var(--hit);border-color:var(--hit)}
.tile.near{background:linear-gradient(var(--shade), transparent 28%, transparent 72%, var(--shade)), var(--near);border-color:var(--near)}
.tile.miss{background:linear-gradient(var(--shade), transparent 28%, transparent 72%, var(--shade)), var(--miss);border-color:var(--miss)}
.tile .a{position:absolute;top:3px;right:5px;font-size:calc(var(--tile) * .22);line-height:1;font-family:var(--body)}
.tile.flip{animation:flip .5s ease-in-out}
.tile.pop{animation:pop .12s ease-out}
.tile.win{animation:jump .5s ease}
.row.shake{animation:shake .4s}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes jump{40%{transform:translateY(-14px)}70%{transform:translateY(3px)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.key{height:var(--key);border-radius:9px;border:none;background:var(--empty);font-family:var(--mono);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;box-shadow:inset 0 -3px 0 var(--shade)}
.key:active{transform:translateY(1px)}
.key.wide{font-family:var(--body);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.key.del{grid-column:span 2}
.key.enter{grid-column:span 3;background:var(--ink);color:var(--bg)}
.key.hit{background:var(--hit);color:var(--on)}
.key.near{background:var(--near);color:var(--on)}
.key.miss{background:var(--miss);color:var(--on);opacity:.75}

.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:9px;z-index:30;max-width:calc(100% - 32px);text-align:center}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:grid;place-items:center;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.sheet{position:relative;width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--surface);border-radius:14px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:16px}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.04em;text-transform:uppercase;line-height:1;text-wrap:balance;padding-right:36px}
.sheet p{margin:0;line-height:1.5;color:var(--ink)}
.sheet .muted{color:var(--muted);font-size:14px}
.close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;line-height:1.45}
.ex{display:grid;grid-template-columns:repeat(5,44px);gap:6px;--tile:44px}
.legend{display:grid;gap:6px;font-size:14px;line-height:1.4}
.legend b{font-family:var(--mono)}
.ptable{display:grid;grid-template-columns:repeat(8,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ptable span{padding:5px 0;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.ptable b{padding:6px 0;font-size:15px}

.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.nums b{display:block;font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.nums span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dist{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:center;font-family:var(--mono);font-size:13px}
.bar i{display:block;min-width:26px;background:var(--miss);color:var(--on);font-style:normal;text-align:right;padding:2px 7px;border-radius:4px;font-variant-numeric:tabular-nums}
.bar.today i{background:var(--hit)}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.answer{display:flex;gap:6px;--tile:46px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 140px;min-height:46px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:700;padding:0 14px}
.btn.primary{background:var(--hit);border-color:var(--hit);color:var(--on)}
.btn:disabled{opacity:.6;cursor:default}
.next{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.next b{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
textarea.copybox{width:100%;height:150px;font-family:var(--mono);font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px}
.note{padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px;line-height:1.45}
.note.ok{border-left:4px solid var(--hit)}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;margin-right:8px}
.inline-ico{width:18px;height:18px;margin:0 2px}
[data-install]{display:flex;align-items:center;justify-content:center}
.toggles{display:grid;gap:14px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stack>*{min-width:0}
.note.warn{border-left:4px solid var(--near)}
.note.bad{border-left:4px solid var(--bad)}

/* sign-in + leaderboard */
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.form>*{min-width:0}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.field label{font-size:13px;font-weight:600}
.field input{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:1em}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:4px;border-radius:10px;background:var(--bg)}
.tabs button{border:none;background:transparent;border-radius:7px;height:36px;font-weight:700;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shade)}
.board-list{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.board-list li{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.board-list li.me{background:var(--bg);border-radius:8px}
.board-list .pos{font-family:var(--mono);font-weight:700;color:var(--muted);text-align:right}
.board-list .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-list .gs{font-family:var(--mono);font-size:12px;color:var(--muted)}
.board-list .pt{font-family:var(--mono);font-weight:700;font-size:16px;min-width:44px;text-align:right}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.link{border:none;background:none;color:var(--accent);font-weight:700;padding:4px 0;text-decoration:underline}
.tabs.two{grid-template-columns:1fr 1fr}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.btn.small{flex:0 0 auto;min-height:46px}
.ch-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ch{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.ch.focus{border-color:var(--near);box-shadow:0 0 0 2px var(--near)}
.ch-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ch-top strong{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stake{font-family:var(--mono);font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stake.good,.chip.good{color:var(--hit)}.stake.bad,.chip.bad{color:var(--bad)}
.ch-meta{font-size:13px;color:var(--muted)}
.ch-clue{font-weight:600}
.ch-act{display:flex;gap:8px;flex-wrap:wrap}
.ch-act{align-items:center}
.ch-act .btn{flex:0 0 auto}
.chip:not(.good):not(.bad){color:var(--muted);font-family:var(--body)}
.ch-confirm{display:grid;gap:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.45}
.chip{font-weight:700;font-size:14px;font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.flabel{font-size:13px;font-weight:600}
.cluebox{padding:12px;border-radius:10px;border:1px dashed var(--line);background:var(--bg);font-weight:600;line-height:1.4}
.field input,.field select,.field textarea{width:100%;min-width:0}
.inline input{width:auto}
#chBody,#lbBody{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start}
#chBody>*,#lbBody>*{min-width:0}
#chBody .label{margin-top:4px}
.field select,.field textarea{border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit;font-size:16px}
.field select{height:46px}
.field textarea{padding:10px;resize:vertical;min-height:64px}
.codein{font-family:var(--mono);font-size:24px!important;letter-spacing:.3em}
.nums.two{grid-template-columns:1fr 1fr}
.quota{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;border-radius:10px;background:var(--bg);font-size:14px}
.quota b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.timeline{display:flex;justify-content:space-between;align-items:baseline}
.timeline b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.ok-msg{color:var(--hit);font-size:14px;font-weight:600}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--hit)}

@media (max-width:400px){.tools{gap:4px}.icon{width:34px;height:34px}.icon svg{width:17px;height:17px}.brand h1{font-size:30px}.top{gap:8px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="titlerow"><h1>Tally</h1><span class="beta" id="betaTag" hidden>Beta</span></div><span class="sub" id="sub"></span></div>
    <nav class="tools">
      <button class="icon" id="btnBell" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <button class="icon" id="btnHelp" aria-label="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.3-2.7 4"/><path d="M12 17.6v.1"/></svg></button>
      <button class="icon" id="btnBoard" aria-label="Leaderboard"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg></button>
      <button class="icon" id="btnChallenge" aria-label="Challenges"><svg viewBox="0 0 24 24"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"/></svg></button>
      <button class="icon" id="btnPractice" aria-label="Practice with a random code"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button>
    </nav>
  </header>
  <div class="clue" id="clue"><span class="clue-label" id="clueLabel">Today's clue</span><span class="clue-text" id="clueText"></span><span class="clock" id="clock" aria-label="Time taken">0:00</span></div>
  <main class="board-wrap"><div class="board" id="board" aria-live="polite"></div></main>
  <div class="keypad" id="keypad"></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

(function(){
const SITE=location.protocol==='https:'?(location.host+location.pathname).replace(/index\.html$/,'').replace(/\/$/,''):'delooze29-stack.github.io/tally';
const IS_BETA=/\/beta\//.test(location.pathname);
const MAX=7, LEN=5, POINTS=[10,8,6,4,3,2,1];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- Firebase ---------- */
let auth=null, db=null, user=null, player=null;
try{
  firebase.initializeApp({
    apiKey:"AIzaSyDZxOrRdaHyyUnXvdfIIhMKrD6Qf-jOnBA",
    authDomain:"tally-51fbb.firebaseapp.com",
    projectId:"tally-51fbb",
    storageBucket:"tally-51fbb.firebasestorage.app",

  });
  auth=firebase.auth(); db=firebase.firestore();
}catch(e){console.warn('Leaderboard offline',e)}

const slug=n=>n.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
const emailFor=n=>slug(n)+'@players.tally.game';

/* ---------- Daily code ---------- */
const EPOCH=Date.UTC(2026,9,23);
function todayNum(){const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/864e5)+1}
const DAY=todayNum();
/* Two codes a day, UK time: a morning code from 8am and an evening code from 8pm.
   Code No. 1 was the morning of Fri 23 Oct 2026. Scores for these codes are saved with
   day = 100000 + code number, so they never mix with the old once-a-day scores. */
const R_BASE=100000;
function londonParts(t){
  try{const o={};new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'})
    .formatToParts(new Date(t)).forEach(p=>o[p.type]=p.value);return {y:+o.year,m:+o.month,d:+o.day,h:+o.hour%24}}
  catch(e){const d=new Date(t);return {y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate(),h:d.getHours()}}
}
function roundAt(t){const p=londonParts(t);const d=Math.round((Date.UTC(p.y,p.m-1,p.d)-Date.UTC(2026,9,23))/864e5);return d*2+(p.h>=20?2:p.h>=8?1:0)}
const ROUND=roundAt(Date.now()), RKEY=R_BASE+ROUND;
const isEvening=()=>ROUND%2===0;
function msToNext(){const now=Date.now();let lo=now,hi=now+13*36e5;while(hi-lo>1000){const mid=(lo+hi)/2;if(roundAt(mid)>ROUND)hi=mid;else lo=mid}return hi-now}
/* If a new code arrives while Tally is open, load it (unless you're mid-game). */
setInterval(()=>{if(roundAt(Date.now())!==ROUND&&S&&S.mode!=='challenge'&&(S.done||!S.guesses.length)&&!modal)location.reload()},30000);

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function puzzle(seed){
  const r=rng(seed);const code=[];
  for(let i=0;i<LEN;i++)code.push(Math.floor(r()*10));
  return {code:code.join(''),clue:mathsClue(code,r)};
}
const P=['1st','2nd','3rd','4th','5th'];
function mathsClue(c,r){
  const pick=n=>Math.floor(r()*n), special=[];
  for(let i=0;i<5;i++)for(let j=0;j<5;j++){
    if(i===j)continue;
    if(c[j]!==0&&c[j]===2*c[i])special.push(`The ${P[j]} digit is double the ${P[i]}`);
    if(j>i)for(let k=0;k<5;k++){if(k!==i&&k!==j&&c[i]+c[j]===c[k])special.push(`The ${P[i]} and ${P[j]} digits add up to the ${P[k]} digit`)}
  }
  if(special.length&&r()<0.6)return special[pick(special.length)];
  let i=pick(5),j=pick(4);if(j>=i)j++;if(j<i)[i,j]=[j,i];
  const t=pick(4);
  if(t===0)return `The ${P[i]} and ${P[j]} digits add up to ${c[i]+c[j]}`;
  if(t===1&&c[i]*c[j]>0)return `The ${P[i]} and ${P[j]} digits multiply to ${c[i]*c[j]}`;
  if(t===2&&c[i]!==c[j]){const[a,b]=c[i]>c[j]?[i,j]:[j,i];return `The ${P[a]} digit is ${c[a]-c[b]} more than the ${P[b]}`}
  return `All five digits add up to ${c.reduce((x,y)=>x+y,0)}`;
}

function score(g,c){
  const state=Array(LEN).fill('miss'), arrow=Array(LEN).fill(''), left={};
  for(let i=0;i<LEN;i++){if(g[i]===c[i])state[i]='hit';else left[c[i]]=(left[c[i]]||0)+1}
  for(let i=0;i<LEN;i++){
    if(state[i]==='hit')continue;
    if(left[g[i]]>0){state[i]='near';left[g[i]]--}
    arrow[i]=+c[i]>+g[i]?'▲':'▼';
  }
  return {state,arrow};
}
const pointsFor=(won,n)=>won?POINTS[n-1]:0;
/* The clue for the 8am/8pm code costs points: using it takes CLUE_COST off what you score
   for that code (never below 0). Practice games and challenges keep their clue free. */
const CLUE_COST=2;
function codePts(n){
  if(S.remote)return S.remote.points;
  const base=pointsFor(S.won,n);
  return S.mode==='daily'&&S.clueUsed?Math.max(0,base-CLUE_COST):base;
}

/* ---------- Local stats ---------- */
let stats=store.get('tally.stats')||{played:0,wins:0,streak:0,best:0,dist:[0,0,0,0,0,0,0],last:0};
while(stats.dist.length<MAX)stats.dist.push(0);
if(stats.points==null)stats.points=0;
let prefs=store.get('tally.prefs')||{seenHelp:false};
let S, busy=false, modal=false;

/* Each player's daily game is saved separately on the phone, so a second player
   signing in on the same phone gets their own fresh board. Signed-out play is saved as "anon". */
const dayKey=()=>'tally.day.'+(user?user.uid:'anon');
(function migrateOldSave(){
  const old=store.get('tally.day');if(!old)return;
  if(old.n===ROUND&&!old.posted&&!store.get('tally.day.anon'))store.set('tally.day.anon',old);
  try{localStorage.removeItem('tally.day')}catch(e){}
})();
function startDaily(){
  const p=puzzle(ROUND*7919+2026), saved=store.get(dayKey());
  S={mode:'daily',code:p.code,clue:p.clue,guesses:[],current:'',done:false,won:false,posted:false,max:MAX};
  S.elapsed=0;S.runFrom=0;S.secs=0;
  if(saved&&saved.n===ROUND){S.guesses=saved.guesses||[];S.done=!!saved.done;S.won=!!saved.won;S.posted=!!saved.posted;S.elapsed=saved.elapsed||0;S.secs=saved.secs||0;S.remote=saved.remote||null;S.clueUsed=!!saved.clueUsed;
    /* A game started before the timer existed has guesses but no time: don't record a misleading time. */
    if(saved.noTime||(saved.elapsed==null&&S.guesses.length))S.noTime=true}
  draw();
}
function startPractice(){
  const p=puzzle(Math.floor(Math.random()*1e9));
  S={mode:'practice',code:p.code,clue:p.clue,guesses:[],current:'',done:false,won:false,max:MAX,elapsed:0,runFrom:0,secs:0};
  draw();toast('Practice code ready');
}
function persist(){
  if(S.mode==='daily')store.set(dayKey(),{n:ROUND,guesses:S.guesses,done:S.done,won:S.won,posted:S.posted,elapsed:clockMs(),secs:S.secs,noTime:!!S.noTime,remote:S.remote||null,clueUsed:!!S.clueUsed});
  if(S.mode==='challenge')store.set('tally.chclock.'+S.ch.id,{elapsed:clockMs(),secs:S.secs});
}

/* ---------- Timer ----------
   Starts on your first key press, pauses while the page is hidden (switching apps),
   and carries on when you press a key again. Stops when the game ends. */
const clockMs=()=>(S.elapsed||0)+(S.runFrom?Date.now()-S.runFrom:0);
const fmtTime=sec=>{sec=Math.max(0,Math.round(sec));const h=sec/3600|0,m=(sec%3600)/60|0,x=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
function runClock(){if(!S.done&&!S.runFrom)S.runFrom=Date.now()}
function pauseClock(){if(S.runFrom){S.elapsed=clockMs();S.runFrom=0;persist()}}
function stopClock(){pauseClock();S.secs=S.noTime?0:Math.max(1,Math.round(S.elapsed/1000))}
function renderClock(){
  const c=$('clock');if(!c||!S)return;
  c.textContent=S.noTime?'–:––':fmtTime(S.done&&S.secs?S.secs:clockMs()/1000);
  c.className='clock'+(S.done&&S.won?' done':S.runFrom?' run':'');
}
setInterval(renderClock,500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')pauseClock()});
window.addEventListener('pagehide',pauseClock);

/* ---------- Board ---------- */
function draw(){
  const date=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  $('sub').textContent=S.mode==='daily'?`No. ${ROUND} · ${new Date().toLocaleDateString('en-GB',{weekday:'short',timeZone:'Europe/London'})} ${isEvening()?'pm':'am'}`:S.mode==='challenge'?`Crack in ${S.max} · ${S.ch.stake} pts`:'Practice · not counted';
  $('clue').classList.toggle('practice',S.mode!=='daily');
  $('clueLabel').textContent=S.mode==='daily'?(isEvening()?"Tonight's clue":"Today's clue"):S.mode==='challenge'?`${S.ch.setterName}'s clue`:'Practice clue';
  drawClue();
  const b=$('board');b.innerHTML='';
  for(let r=0;r<S.max;r++){
    const row=document.createElement('div');row.className='row';
    for(let i=0;i<LEN;i++){const t=document.createElement('div');t.className='tile';t.innerHTML='<span class="d"></span><span class="a"></span>';row.appendChild(t)}
    b.appendChild(row);
    if(r<S.guesses.length)paintRow(r);
  }
  drawCurrent();drawKeys();renderClock();
}
function drawClue(){
  const el=$('clueText');
  if(S.mode!=='daily'||S.clueUsed||S.done){el.textContent=S.clue;return}
  /* Free for the last two goes: no points taken off. */
  if(S.guesses.length>=MAX-2){el.textContent=S.clue;$('clueLabel').textContent='Free clue';return}
  el.innerHTML=`<button class="cluebtn" id="clueBtn" type="button">💡 Show clue <span>−${CLUE_COST} pts</span></button>`;
  const b=$('clueBtn');
  b.addEventListener('click',()=>{
    if(b.dataset.sure!=='1'){b.dataset.sure='1';b.innerHTML=`Tap again to spend ${CLUE_COST} pts`;setTimeout(()=>{if(b.isConnected&&b.dataset.sure==='1'){b.dataset.sure='';b.innerHTML=`💡 Show clue <span>−${CLUE_COST} pts</span>`}},4000);return}
    S.clueUsed=true;persist();drawClue();toast(`Clue shown. ${CLUE_COST} pts off this code's score`);
  });
}
function paintRow(r){
  const g=S.guesses[r],res=score(g,S.code),tiles=$('board').children[r].children;
  for(let i=0;i<LEN;i++)setTile(tiles[i],g[i],res.state[i],res.arrow[i]);
}
function setTile(t,d,state,arrow){
  t.className='tile '+state;t.querySelector('.d').textContent=d;t.querySelector('.a').textContent=arrow||'';
  t.setAttribute('aria-label',`${d}, ${state==='hit'?'correct':state==='near'?'wrong place':'not in code'}${arrow?', real digit is '+(arrow==='▲'?'higher':'lower'):''}`);
}
function drawCurrent(){
  if(S.done)return;const r=S.guesses.length;if(r>=S.max)return;
  const tiles=$('board').children[r].children;
  for(let i=0;i<LEN;i++){const d=S.current[i]||'';tiles[i].className='tile'+(d?' typed':'');tiles[i].querySelector('.d').textContent=d;tiles[i].querySelector('.a').textContent=''}
}
function drawKeys(){
  const rank={miss:1,near:2,hit:3},best={};
  S.guesses.forEach(g=>{const res=score(g,S.code);for(let i=0;i<LEN;i++){const s=res.state[i];if(!best[g[i]]||rank[s]>rank[best[g[i]]])best[g[i]]=s}});
  document.querySelectorAll('.key[data-k]').forEach(k=>{const d=k.dataset.k;if(/^\d$/.test(d))k.className='key'+(best[d]?' '+best[d]:'')});
}
function buildKeypad(){
  const kp=$('keypad');
  ['1','2','3','4','5','6','7','8','9','0'].forEach(d=>{const b=document.createElement('button');b.className='key';b.dataset.k=d;b.textContent=d;kp.appendChild(b)});
  const del=document.createElement('button');del.className='key wide del';del.dataset.k='del';del.textContent='Delete';kp.appendChild(del);
  const en=document.createElement('button');en.className='key wide enter';en.dataset.k='enter';en.textContent='Enter';kp.appendChild(en);
  kp.addEventListener('click',e=>{const k=e.target.closest('.key');if(k){press(k.dataset.k);k.blur()}});
}
function press(k){
  if(busy||modal||S.done)return;
  runClock();
  if(/^\d$/.test(k)){
    if(S.current.length>=LEN)return;
    S.current+=k;drawCurrent();
    const t=$('board').children[S.guesses.length].children[S.current.length-1];t.classList.add('pop');setTimeout(()=>t.classList.remove('pop'),150);
  }else if(k==='del'){S.current=S.current.slice(0,-1);drawCurrent()}
  else if(k==='enter')submit();
}
function submit(){
  const row=$('board').children[S.guesses.length];
  if(S.current.length<LEN){shake(row);toast('Enter all 5 digits');return}
  const g=S.current;S.guesses.push(g);S.current='';
  const r=S.guesses.length-1,res=score(g,S.code);
  S.won=res.state.every(s=>s==='hit');S.done=S.won||S.guesses.length===S.max;
  if(S.done)stopClock();
  persist();renderClock();if(S.done&&S.mode==='daily'){record();postScore()}
  if(S.mode==='challenge'&&user)saveAttempt();
  busy=true;
  const tiles=row.children,step=RM?0:220;
  for(let i=0;i<LEN;i++){
    setTimeout(()=>{tiles[i].classList.add('flip');setTimeout(()=>setTile(tiles[i],g[i],res.state[i],res.arrow[i]),RM?0:250)},i*step);
  }
  setTimeout(()=>{busy=false;drawKeys();if(S.mode==='daily'&&!S.done&&!S.clueUsed&&S.guesses.length===MAX-2){drawClue();toast('Last two goes: the clue is free')}if(S.done)finish(r)},RM?20:(LEN-1)*step+520);
}
function shake(row){row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake')}
function record(){
  stats.played++;stats.points+=codePts(S.guesses.length);
  if(S.won){stats.wins++;stats.streak=(stats.last===ROUND-1)?stats.streak+1:1;stats.best=Math.max(stats.best,stats.streak);stats.dist[S.guesses.length-1]++}
  else stats.streak=0;
  stats.last=S.won?ROUND:0;
  store.set('tally.stats',stats);
}
function finish(r){
  if(S.won){
    const words=['Genius','Brilliant','Sharp','Solid','Nice','Close one','Phew'];
    toast(S.mode==='challenge'?`Cracked it! +${S.ch.stake} pts`:S.mode==='daily'?`${words[r]}! +${codePts(r+1)} points`:`${words[r]}!`);
    [...$('board').children[r].children].forEach((t,i)=>setTimeout(()=>t.classList.add('win'),i*90));
  }else toast('The code was '+S.code);
  setTimeout(showResult,1500);
}


/* ---------- Switching player ----------
   Runs whenever someone signs in or out. Loads that player's own board for today:
   - a signed-out game in progress (not yet on the leaderboard) moves over to the player who signs in;
   - if they've already played today on another phone, the board is locked with their score. */
let switchP=null, switchUid=null;
function switchUser(){
  const uid=user?user.uid:'anon';
  if(switchP&&switchUid===uid)return switchP;
  switchUid=uid;
  switchP=(async()=>{
    let res='none';
    if(user){
      await loadPlayer();
      const anon=store.get('tally.day.anon'), mine=store.get(dayKey());
      if(anon&&anon.n===ROUND&&!anon.posted&&(anon.guesses||[]).length&&!(mine&&mine.n===ROUND&&(mine.guesses||[]).length)){
        store.set(dayKey(),anon);store.set('tally.day.anon',null);
      }
      try{
        const cur=store.get(dayKey());
        if(!(cur&&cur.n===ROUND&&cur.done)){
          const snap=await db.collection('scores').doc(`${RKEY}_${user.uid}`).get();
          if(snap.exists){const d=snap.data();
            store.set(dayKey(),{n:ROUND,guesses:[],done:true,won:d.won,posted:true,secs:d.secs||0,elapsed:0,remote:{guesses:d.guesses,points:d.points}})}
        }
      }catch(e){console.warn(e)}
    }
    if(!S||S.mode==='daily'){
      const wasFresh=!S||!S.guesses.length;
      startDaily();
      if(S.remote&&wasFresh)toast(`You've already played this code: ${S.won?S.remote.guesses:'X'}/7, ${S.remote.points} pts`);
    }
    if(user)res=await postScore();
    return res;
  })().catch(e=>{console.warn(e);switchP=null;return 'error'});
  return switchP;
}

/* ---------- Leaderboard data ---------- */
/* Signing up fires the form and the background sign-in listener at the same moment.
   Both used to create the player record, and the second one was refused, which showed
   "Could not sign in" even though it had worked. Now they share one load. */
let playerP=null, playerUid=null, postP=null;
function loadPlayer(){
  if(!user){player=null;return Promise.resolve()}
  if(playerP&&playerUid===user.uid)return playerP;
  playerUid=user.uid;
  playerP=loadPlayerOnce().catch(e=>{playerP=null;throw e});
  return playerP;
}
async function loadPlayerOnce(){
  if(!user){player=null;return}
  const ref=db.collection('players').doc(user.uid);
  const snap=await ref.get();
  if(snap.exists)player=snap.data();
  else{
    const name=(store.get('tally.pendingName')||user.email.split('@')[0]).slice(0,16);
    player={name,total:0,played:0,wins:0,last:0};
    await ref.set(player);
  }
  try{
    const nref=db.collection('names').doc(slug(player.name));
    if(!(await nref.get()).exists)await nref.set({uid:user.uid});
  }catch(e){console.warn('name claim',e)}
}
function postScore(){
  if(postP)return postP;
  postP=postScoreOnce().finally(()=>{postP=null});
  return postP;
}
async function postScoreOnce(){
  if(!user||!db||S.mode!=='daily'||!S.done||S.posted)return 'none';
  try{
    if(!player)await loadPlayer();
    const sid=`${RKEY}_${user.uid}`, sref=db.collection('scores').doc(sid);
    const existing=await sref.get();
    if(existing.exists){S.posted=true;persist();return 'already'}
    const pts=codePts(S.guesses.length);
    const next={name:player.name,total:player.total+pts,played:player.played+1,wins:player.wins+(S.won?1:0),last:RKEY};
    const batch=db.batch();
    batch.set(sref,{uid:user.uid,name:player.name,day:RKEY,guesses:S.guesses.length,won:S.won,points:pts,clue:!!S.clueUsed,secs:S.secs||0,ts:firebase.firestore.FieldValue.serverTimestamp()});
    batch.set(db.collection('players').doc(user.uid),next);
    await batch.commit();
    player=next;S.posted=true;persist();
    return 'posted';
  }catch(e){console.warn(e);return 'error'}
}

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1900)}
let tick;
function openSheet(html,mount){
  modal=true;clearInterval(tick);
  $('sheet').innerHTML='<button class="close" aria-label="Close" data-close>✕</button>'+html;$('scrim').hidden=false;$('sheet').scrollTop=0;
  if(mount)mount($('sheet'));
}
function closeSheet(){modal=false;$('scrim').hidden=true;clearInterval(tick);if(askPending)setTimeout(maybeAskPush,400)}
/* Close only on a deliberate tap on the dark backdrop: the press must start AND end there,
   so dragging out of a text box (selecting a name, autofill menus) never closes the window.
   Windows with a sign-in form never close from the backdrop at all, only from the X. */
let downOnScrim=false;
$('scrim').addEventListener('pointerdown',e=>{downOnScrim=e.target===$('scrim')});
$('scrim').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeSheet();return}
  const tappedBackdrop=e.target===$('scrim')&&downOnScrim;
  downOnScrim=false;
  if(tappedBackdrop&&!$('sheet').querySelector('form'))closeSheet();
});

    intro=box.querySelector('#signIntro');
  let mode='new', checked='';
  const setMode=m=>{
    mode=m;checked='';err.textContent='';ok.hidden=true;
    box.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===m));
    const back=m==='back';
    chk.hidden=back;pwBlock.hidden=!back;btn.hidden=!back;
    btn.textContent=back?'Sign in':'Create player';
    pw.autocomplete=back?'current-password':'new-password';
    intro.textContent=back?'Sign in with your nickname and password.':'Choose a nickname for the leaderboard. No real names or emails needed.';
  };
  box.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
  const validName=()=>{
    const n=nm.value.trim();
    if(slug(n).length<2){err.textContent='Use at least 2 letters or numbers.';return null}
    if(!/^[A-Za-z0-9 _.-]+$/.test(n)){err.textContent='Use letters, numbers, spaces, dots, dashes or underscores only.';return null}
    return n;
  };
  async function checkName(){
    err.textContent='';ok.hidden=true;
    const n=validName();if(!n)return false;
    if(!db){err.textContent='The leaderboard is offline right now. Try again later.';return false}
    chk.disabled=true;chk.textContent='…';
    try{
      const taken=(await db.collection('names').doc(slug(n)).get()).exists;
      if(taken){err.textContent=`"${n}" is already taken. Choose a different nickname.`;pwBlock.hidden=true;btn.hidden=true;return false}
      checked=slug(n);ok.textContent=`"${n}" is free. Now choose a password.`;ok.hidden=false;pwBlock.hidden=false;btn.hidden=false;pw.focus();
      return true;
    }catch(e){console.warn(e);err.textContent=e.code==='permission-denied'?'Name check is blocked by the database rules. The game owner needs to update them.':'Could not check that name. Check your connection.';return false}
    finally{chk.disabled=false;chk.textContent='Check'}
  }
  chk.addEventListener('click',checkName);
  nm.addEventListener('input',()=>{if(mode==='new'&&checked&&slug(nm.value)!==checked){checked='';ok.hidden=true;pwBlock.hidden=true;btn.hidden=true}});
  nm.addEventListener('keydown',e=>{if(e.key==='Enter'&&mode==='new'){e.preventDefault();checkName()}});
  f.addEventListener('submit',async e=>{
    e.preventDefault();err.textContent='';
    if(!auth){err.textContent='The leaderboard is offline right now. Try again later.';return}
    const n=validName();if(!n)return;
    if(mode==='new'&&checked!==slug(n)){if(!(await checkName()))return}
    if(pw.value.length<6){err.textContent='Password needs at least 6 characters.';return}
    btn.disabled=true;btn.textContent=mode==='new'?'Creating…':'Signing in…';
    try{
      const keep=box.querySelector('#remember').checked;
      await auth.setPersistence(keep?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION);
      store.set('tally.pendingName',n);
      if(mode==='new'){
        try{await auth.createUserWithEmailAndPassword(emailFor(n),pw.value)}
        catch(e2){if(e2.code==='auth/email-already-in-use')throw{code:'taken'};throw e2}
      }else{
        await auth.signInWithEmailAndPassword(emailFor(n),pw.value);
      }
      user=auth.currentUser;
      const res=await switchUser();
      toast(res==='posted'?`Welcome ${player.name}. Today's score added`:`Signed in as ${player.name}`);
      after&&after();
    }catch(e){
      console.warn(e);
      if(auth.currentUser&&slug((auth.currentUser.email||'').split('@')[0])===slug(n)){
        user=auth.currentUser;
        try{await loadPlayer()}catch(x){console.warn(x)}
        if(player){toast(`Signed in as ${player.name}`);after&&after();return}
      }
      err.textContent=e.code==='taken'?`"${n}" is already taken. Choose a different nickname.`:
        ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(e.code)?'Nickname or password is wrong.':
        e.code==='auth/too-many-requests'?'Too many tries. Wait a minute and try again.':
        e.code==='auth/network-request-failed'?'No connection. Check your signal and try again.':
        e.code==='auth/weak-password'?'Pick a longer password.':
        'Could not sign in. Try again.';
      btn.disabled=false;btn.textContent=mode==='new'?'Create player':'Sign in';
    }
  });
}

const VAPID_KEY='BOy3jkYpQhsz8cQgbIG7-mFrsBEn4mnbV4rKwaDh_0OXhVAdVgHCrfjYJF7f9HWUsF2Vjh-C-VENkpTDIIv2Zz0';   // From Firebase: Project settings > Cloud Messaging > Web Push certificates
const pushRef=()=>db.collection('push').doc(user.uid);
const pushTokenKey=()=>'tally.push.'+user.uid;
function pushSupport(){
  if(!VAPID_KEY)return 'notready';
  if(isIOS()&&!isStandalone())return 'ios';
  if(!('serviceWorker' in navigator)||!('Notification' in window)||!('PushManager' in window))return 'unsupported';
  if(typeof firebase==='undefined'||typeof firebase.messaging!=='function')return 'unsupported';
  if(Notification.permission==='denied')return 'blocked';
  return 'ok';
}
async function enablePush(prefs){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return 'denied';
    /* Use this page's own background script, never one from another part of the site. */
    const reg=await navigator.serviceWorker.register('sw.js');
    await reg.update().catch(()=>{});
    const sw=reg.active||reg.waiting||reg.installing;
    if(sw&&sw.state!=='activated')await new Promise(r=>{sw.addEventListener('statechange',()=>{if(sw.state==='activated')r()});setTimeout(r,4000)});
    /* Start fresh: clear any old sign-up Firebase remembers (it may be dead), then make a new one. */
    try{await firebase.messaging().deleteToken()}catch(e){}
    try{const sub=await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe()}catch(e){}
    const t=await firebase.messaging().getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
    if(!t)throw new Error('no token');
    const old=store.get(pushTokenKey());
    if(old&&old!==t)await pushRef().set({tokens:FV().arrayRemove(old),updated:FV().serverTimestamp()},{merge:true}).catch(()=>{});
    await pushRef().set({...prefs,name:player?player.name:'',tokens:FV().arrayUnion(t),updated:FV().serverTimestamp()},{merge:true});
    store.set(pushTokenKey(),t);
    return 'ok';
  }catch(x){console.warn(x);return 'error'}
}

/* ---------- Fair play ----------
   Cracking the code first time is about a 1 in 5,000 chance. Twice in 7 days is about
   1 in 25 million, three times about 1 in 125 billion. So:
   1 first-guess win in 7 days: allowed, shown with a clover.
   2: a warning.  3 or more: account on hold (hidden from the leaderboards).
   To clear someone, add a document to the "clears" collection in Firebase with the
   player's user ID as the document ID and a number field "day" set to today's code number.
   First-guess wins on or before that day are then ignored. */
const LUCKY_WARN=2, LUCKY_HOLD=3;
let luckyCache=null, luckyAt=0;
async function loadLucky(force){
  if(!db)return {};
  if(!force&&luckyCache&&Date.now()-luckyAt<20000)return luckyCache;
  const [q,cl]=await Promise.all([
    db.collection('scores').where('day','>=',RKEY-13).get(),
    db.collection('clears').get().catch(()=>({docs:[]}))
  ]);
  const cleared={};cl.docs.forEach(d=>cleared[d.id]=+d.data().day||0);
  const lucky={};
  q.docs.forEach(d=>{const x=d.data();if(x.won&&x.guesses===1&&x.day-R_BASE>(cleared[x.uid]||0))lucky[x.uid]=(lucky[x.uid]||0)+1});
  luckyCache=lucky;luckyAt=Date.now();return lucky;
}
const isHeld=(lucky,uid)=>(lucky[uid]||0)>=LUCKY_HOLD;
const HOLD_MSG=`<div class="note bad"><strong>Your account is on hold.</strong> You've cracked the code first time ${LUCKY_HOLD} times in 7 days, which is about a 1 in 125 billion chance. Your scores won't show on the leaderboards and you can't play challenges for now. If this is a mistake, contact the game's owner.</div>`;
const WARN_MSG=`<div class="note warn"><strong>That's ${LUCKY_WARN} first-guess wins in 7 days.</strong> The odds of that are about 1 in 25 million. One more this week and your account goes on hold.</div>`;
const LUCKY_MSG=`<div class="note ok">First-guess win 🍀 That's about a 1 in 5,000 chance. It shows with a clover on today's leaderboard.</div>`;

/* ---------- Leaderboard ---------- */
let lbTab='today';
function showBoard(tab){
  if(tab)lbTab=tab;
  const tabs=`<div class="tabs" role="tablist">${[['today','This code'],['all','All time'],['me','My stats']].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${lbTab===k}">${l}</button>`).join('')}</div>`;
  const who=user&&player?`<div class="who"><span>Playing as <strong>${esc(player.name)}</strong></span><button class="link" id="signOut">Sign out</button></div>`:'';
  openSheet(`<h2>Leaderboard</h2>${tabs}${who}<div id="lbBody"><p class="muted">Loading…</p></div>`,sh=>{

    const so=sh.querySelector('#signOut');if(so)so.addEventListener('click',async()=>{await auth.signOut();user=null;player=null;await switchUser();toast('Signed out');showBoard()});
    fillBoard(sh.querySelector('#lbBody'));
  });

async function fillBoard(el){
  if(lbTab==='me'){el.innerHTML=myStatsHTML();return}
  if(!db){el.innerHTML='<p class="muted">The leaderboard is offline right now.</p>';return}
  let rows=[], held=0;
  try{
    if(lbTab==='today'){
      const [q,lucky]=await Promise.all([db.collection('scores').where('day','==',RKEY).get(),loadLucky(true).catch(()=>({}))]);
      const t=d=>d.secs||1e9;
      held=q.docs.map(d=>d.data()).filter(d=>isHeld(lucky,d.uid)).length;
      rows=q.docs.map(d=>d.data()).filter(d=>!isHeld(lucky,d.uid)).sort((a,b)=>b.points-a.points||t(a)-t(b)||a.guesses-b.guesses)
        
        .map(d=>({uid:d.uid,name:d.name+(d.won&&d.guesses===1?' 🍀':'')+(d.clue?' 💡':''),pts:d.points,meta:(d.won?`${d.guesses}/7`:'X/7')+(d.secs?` · ${fmtTime(d.secs)}`:'')}));
    }else{
      const [q,atts,lucky]=await Promise.all([db.collection('players').orderBy('total','desc').limit(200).get(),loadAttempts().catch(()=>[]),loadLucky().catch(()=>({}))]);
      held=q.docs.filter(d=>isHeld(lucky,d.id)).length;
      rows=q.docs.map(d=>({uid:d.id,...d.data()})).filter(d=>!isHeld(lucky,d.uid))
        .map(d=>({uid:d.uid,name:d.name,played:d.played,pts:Math.max(0,d.total+chNet(d.uid,atts)),ch:atts.some(a=>a.uid===d.uid||a.setter===d.uid)}))
        .filter(d=>d.played>0||d.ch).sort((a,b)=>b.pts-a.pts).slice(0,50)
        .map(d=>({...d,meta:`${d.played} played`}));
    }
  }catch(e){console.warn(e);el.innerHTML='<p class="muted">Could not load the leaderboard. Check your connection.</p>';return}
  let html='';
  if(!rows.length)html=`<p class="muted">${lbTab==='today'?"Nobody has posted a score for this code yet. Be the first.":'No scores yet.'}</p>`;
  else{
    let pos=0,prev=null;
    html='<ol class="board-list">'+rows.map((r,i)=>{if(r.pts!==prev){pos=i+1;prev=r.pts}
      return `<li class="${user&&r.uid===user.uid?'me':''}"><span class="pos">${pos}</span><span class="nm">${esc(r.name)}</span><span class="gs">${r.meta}</span><span class="pt">${r.pts}</span></li>`}).join('')+'</ol>';
  }
  if(held)html+=`<p class="muted" style="font-size:12px">${held} player${held>1?'s':''} on hold for too many first-guess wins.</p>`;
  if(user&&luckyCache&&isHeld(luckyCache,user.uid))html=HOLD_MSG+html;
  if(!user)html+=`<div class="label" style="margin-top:18px">Get on the board</div>`+signInHTML();
  el.innerHTML=html;
  mountSignIn(el,()=>showBoard());
}
function myStatsHTML(){
  const pct=stats.played?Math.round(stats.wins/stats.played*100):0, mx=Math.max(1,...stats.dist);
  const todayRow=S.mode==='daily'&&S.done&&S.won?S.guesses.length-1:-1;
  const total=player?myPoints():stats.points;
  return `<div class="nums"><div><b>${total}</b><span>Points</span></div><div><b>${stats.played}</b><span>Played</span></div><div><b>${pct}</b><span>Win %</span></div><div><b>${stats.streak}</b><span>Streak</span></div></div>
  <div><div class="label" style="margin-bottom:8px">Guess distribution</div><div class="dist">${stats.dist.map((n,i)=>`<div class="bar${i===todayRow?' today':''}"><span>${i+1}</span><i style="width:${Math.max(8,n/mx*100)}%">${n}</i></div>`).join('')}</div></div>
  <p class="muted">Played, win % and streak are for this phone. Points ${player?'come from the leaderboard and include challenge wins and losses':'count once you sign in'}.</p>`;
}

/* ---------- Challenges ---------- */
/* Free version: the code is scrambled, not secret. Fine among friends; a server check would make it cheat-proof. */
const CH_MAX_OPEN=3, CH_DAYS=7, CH_MIN_TARGET=3, CH_PER_DAY=5;
const limitRef=()=>db.collection('limits').doc(user.uid+'_'+DAY);
async function takenToday(){const d=await limitRef().get();return d.exists?d.data().n:0}
const FV=()=>firebase.firestore.FieldValue;
function chKey(id){let h=2166136261;for(const c of id)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function encCode(code,id){const r=rng(chKey(id));return 't1'+[...code].map(d=>(+d+Math.floor(r()*10))%10).join('')}
function decCode(c,id){const r=rng(chKey(id));return [...c.slice(2)].map(d=>(+d-Math.floor(r()*10)+10)%10).join('')}
/* The clue is always worked out by the game from the real code, so it can't be wrong or misleading. */
function chClue(c){return mathsClue([...decCode(c.c,c.id)].map(Number),rng(c.cs|0))}

let attemptsCache=null, attemptsAt=0;
async function loadAttempts(force){
  if(!db)return [];
  if(!force&&attemptsCache&&Date.now()-attemptsAt<20000)return attemptsCache;
  const q=await db.collection('attempts').get();
  attemptsCache=q.docs.map(d=>({id:d.id,...d.data()}));attemptsAt=Date.now();
  return attemptsCache;
}
/* An attempt that's still being played counts as a loss until it's won. */
function attemptDelta(a,uid){
  if(!uid)return 0;
  if(a.uid===uid)return a.won?a.stake:-a.stake;
  if(a.setter===uid)return a.won?-a.stake:a.stake;
  return 0;
}
function chNet(uid,atts){return (atts||[]).reduce((s,a)=>s+attemptDelta(a,uid),0)}
function myPoints(){return Math.max(0,(player?player.total:0)+chNet(user&&user.uid,attemptsCache))}
const signed=n=>(n>0?'+':n<0?'−':'')+Math.abs(n);
function timeLeft(ms){const h=Math.max(0,Math.round((ms-Date.now())/36e5));return h>=48?`${Math.round(h/24)} days left`:h>=1?`${h}h left`:'ending soon'}

let chTab='open', chFocus=null, authReadyResolve, authReady=new Promise(r=>authReadyResolve=r);
setTimeout(()=>authReadyResolve&&authReadyResolve(),3000);

function showChallenges(tab){
  if(tab)chTab=tab;
  const tabs=`<div class="tabs" role="tablist">${[['open','Open'],['set','Set one'],['mine','Mine']].map(([k,l])=>`<button role="tab" data-ctab="${k}" aria-selected="${chTab===k}">${l}</button>`).join('')}</div>`;
  openSheet(`<h2>Challenges</h2>${tabs}<div id="chBody"><p class="muted">Loading…</p></div>`,sh=>{
    sh.querySelectorAll('[data-ctab]').forEach(b=>b.addEventListener('click',()=>{chFocus=null;showChallenges(b.dataset.ctab)}));
    fillChallenges(sh.querySelector('#chBody'));

async function fillChallenges(el){
  if(!db){el.innerHTML='<p class="muted">Challenges are offline right now.</p>';return}
  await authReady;
  if(!user){
    el.innerHTML=`<p>Set a code for others to crack, or take on someone else's. Points change hands, so pick a nickname first.</p>`+signInHTML();
    mountSignIn(el,()=>showChallenges());return;
  }
  try{
    if(!player)await loadPlayer();
    await loadAttempts(true);
    const lucky=await loadLucky().catch(()=>({}));
    if(isHeld(lucky,user.uid)){el.innerHTML=HOLD_MSG;return}
    if(chTab==='open')await fillOpen(el);
    else if(chTab==='set')fillSet(el);
    else await fillMine(el);
  }catch(e){console.warn(e);el.innerHTML=`<p class="muted">${e.code==='permission-denied'?'Challenges are blocked by the database rules. The game owner needs to update them.':'Could not load challenges. Check your connection.'}</p>`}
}

function chRow(c,mineAtt){
  let action='';
  if(c.setter===user.uid){
    action=`<span class="chip">Your challenge</span><button class="btn small" data-share="${c.id}">Copy link</button>`;
  }else if(mineAtt){
    action=mineAtt.status==='playing'?`<button class="btn primary small" data-resume="${c.id}">Resume</button>`:
      mineAtt.won?`<span class="chip good">Cracked it ${signed(c.stake)}</span>`:`<span class="chip bad">Beaten ${signed(-c.stake)}</span>`;
  }else action=`<button class="btn primary small" data-accept="${c.id}">Take it on</button>`;
  return `<li class="ch${chFocus===c.id?' focus':''}" id="ch-${c.id}">
    <div class="ch-top"><strong>${esc(c.setterName)}</strong><span class="stake">${c.stake} pts</span></div>
    <div class="ch-meta">Crack it in ${c.target} · ${c.tries} tried · ${c.cracks} cracked · ${timeLeft(c.expires)}</div>
    <div class="ch-clue">“${esc(chClue(c))}”</div>
    <div class="ch-act">${action}</div>
    <div class="ch-confirm" hidden></div>
  </li>`;
}

async function fillOpen(el){

    .sort((a,b)=>(a.setter===user.uid)-(b.setter===user.uid)||(b.created?.seconds||0)-(a.created?.seconds||0));
  let focusNote='';
  if(chFocus){
    const f=list.find(c=>c.id===chFocus);

    if(f)list=[f,...list.filter(c=>c!==f)];
    else{
      const snap=await db.collection('challenges').doc(chFocus).get();
      focusNote=!snap.exists?`<div class="note">That challenge link doesn't work any more.</div>`:

  }

    <div class="quota"><span>Taken on today</span><b>${today} of ${CH_PER_DAY}</b></div>`+
    (list.length?`<ul class="ch-list">${list.map(c=>chRow(c,myAtt(c.id))).join('')}</ul>`:

  const gs=el.querySelector('#goSet');if(gs)gs.addEventListener('click',()=>showChallenges('set'));
  el.querySelectorAll('[data-accept]').forEach(b=>b.addEventListener('click',()=>{
    const c=list.find(x=>x.id===b.dataset.accept), box=b.closest('.ch').querySelector('.ch-confirm');
    if(today>=CH_PER_DAY){box.innerHTML=`<p class="err">You've taken on ${CH_PER_DAY} challenges today. Come back tomorrow for more.</p>`;box.hidden=false;return}
    if(myPoints()<c.stake){box.innerHTML=`<p class="err">You need ${c.stake} pts to take this on. Play today's code to earn some.</p>`;box.hidden=false;return}
    box.innerHTML=`<p>You're putting <strong>${c.stake} pts</strong> on the line. Crack it in ${c.target} or fewer to win ${c.stake} from ${esc(c.setterName)}. If you start and stop, it counts as a miss.</p>
      <div class="actions"><button class="btn primary" data-go>Accept and play</button><button class="btn" data-cancel>Cancel</button></div><p class="err"></p>`;
    box.hidden=false;

    });

  }));

async function acceptChallenge(c){
  const aref=db.collection('attempts').doc(c.id+'_'+user.uid), cref=db.collection('challenges').doc(c.id);
  const n=await takenToday();
  if(n>=CH_PER_DAY)throw{code:'limit'};
  const att={ch:c.id,uid:user.uid,name:player.name,setter:c.setter,sname:c.setterName,stake:c.stake,target:c.target,day:DAY,g:[],status:'playing',won:false,ts:FV().serverTimestamp()};
  const b=db.batch();b.set(aref,att);b.update(cref,{tries:FV().increment(1)});b.set(limitRef(),{uid:user.uid,day:DAY,n:n+1});
  await b.commit();
  attemptsAt=0;
  startChallenge({...c,tries:c.tries+1},att);
}
function startChallenge(c,att){
  S={mode:'challenge',ch:c,code:decCode(c.c,c.id),clue:chClue(c),guesses:(att&&att.g)||[],current:'',
     done:!!att&&att.status==='done',won:!!att&&!!att.won,max:c.target,runFrom:0,
     elapsed:(store.get('tally.chclock.'+c.id)||{}).elapsed||0,secs:(att&&att.secs)||(store.get('tally.chclock.'+c.id)||{}).secs||0};
  closeSheet();draw();
  if(S.done)showResult();else toast(`Crack ${c.setterName}'s code in ${c.target}`);
}
let saveQ=Promise.resolve();
function saveAttempt(){
  const snap={g:S.guesses.slice(),status:S.done?'done':'playing',won:S.won,...(S.done?{secs:S.secs}:{})}, c=S.ch;
  saveQ=saveQ.then(async()=>{
    const aref=db.collection('attempts').doc(c.id+'_'+user.uid);
    const data={...snap,ts:FV().serverTimestamp()};
    try{
      if(snap.won){const b=db.batch();b.update(aref,data);b.update(db.collection('challenges').doc(c.id),{cracks:FV().increment(1)});await b.commit()}
      else await aref.update(data);
      attemptsAt=0;
    }catch(e){console.warn(e);toast("Couldn't save that guess. Check your connection.")}
  });
}

function fillSet(el){
  const pts=myPoints();
  const myOpen=0;
  if(pts<1){el.innerHTML=`<p>You need some points to stake before you can set a challenge.</p><p class="muted">Play today's code to earn up to 10 points, then come back.</p>`;return}
  const maxStake=Math.min(10,pts);
  el.innerHTML=`<form class="form" id="chForm" novalidate>
    <p class="muted">Choose a code for others to crack. If they crack it within your target, they take your stake. If not, you take theirs. You have <strong>${pts} pts</strong>.</p>
    <div class="field"><label for="chCode">Your 5-digit code</label><input id="chCode" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" placeholder="e.g. 40719" class="codein"></div>
    <div class="grid2">
      <div class="field"><label for="chTarget">Crack it in</label><select id="chTarget">${[3,4,5,6,7].map(n=>`<option value="${n}"${n===4?' selected':''}>${n} guesses</option>`).join('')}</select></div>
      <div class="field"><label for="chStake">Stake</label><select id="chStake">${Array.from({length:maxStake},(_,i)=>i+1).map(n=>`<option value="${n}"${n===Math.min(5,maxStake)?' selected':''}>${n} pts</option>`).join('')}</select></div>
    </div>
    <div class="field"><span class="flabel">Clue players will see</span><div class="cluebox" id="chClue">Type your code and the game will make a maths clue from it.</div>
      <button class="link" type="button" id="newClue">Give me a different clue</button></div>
    <div class="err" id="chErr"></div>
    <button class="btn primary" type="submit" id="chMake">Set challenge</button>
  </form><div id="chDone"></div>`;
  const code=el.querySelector('#chCode'), clue=el.querySelector('#chClue'), err=el.querySelector('#chErr');
  let seed=Math.floor(Math.random()*1e9);
  const autoClue=()=>{clue.textContent=/^\d{5}$/.test(code.value)?mathsClue([...code.value].map(Number),rng(seed)):'Type your code and the game will make a maths clue from it.'};
  code.addEventListener('input',()=>{code.value=code.value.replace(/\D/g,'').slice(0,5);autoClue()});
  el.querySelector('#newClue').addEventListener('click',()=>{if(!/^\d{5}$/.test(code.value)){err.textContent='Type your 5-digit code first.';return}err.textContent='';seed=(seed+1)%1e9;autoClue()});
  el.querySelector('#chForm').addEventListener('submit',async e=>{
    e.preventDefault();err.textContent='';
    const c=code.value, t=+el.querySelector('#chTarget').value, s=+el.querySelector('#chStake').value;
    if(!/^\d{5}$/.test(c)){err.textContent='Your code needs exactly 5 digits.';return}
    const btn=el.querySelector('#chMake');btn.disabled=true;btn.textContent='Setting…';
    try{
      const mine=await db.collection('challenges').where('setter','==',user.uid).get();
      const open=mine.docs.filter(d=>d.data().open&&d.data().expires>Date.now()).length;
      if(open>=CH_MAX_OPEN){err.textContent=`You already have ${CH_MAX_OPEN} challenges open. Close one under Mine first.`;btn.disabled=false;btn.textContent='Set challenge';return}
      const ref=db.collection('challenges').doc();
      await ref.set({setter:user.uid,setterName:player.name,c:encCode(c,ref.id),cs:seed,target:t,stake:s,
        created:FV().serverTimestamp(),expires:Date.now()+CH_DAYS*864e5,open:true,tries:0,cracks:0});
      el.querySelector('#chForm').hidden=true;
      shareChallengeBox(el.querySelector('#chDone'),{id:ref.id,target:t,stake:s},true);
    }catch(x){console.warn(x);err.textContent=x.code==='permission-denied'?'Blocked by the database rules. The game owner needs to update them.':'Could not set it. Check your connection.';btn.disabled=false;btn.textContent='Set challenge'}
  });
}
function challengeLink(id){return `https://${SITE}/#c${id}`}
function shareChallengeBox(box,c,fresh){
  const txt=`Can you crack my Tally code in ${c.target} guesses? ${c.stake} points on the line 👀\n${challengeLink(c.id)}`;
  box.innerHTML=`${fresh?`<div class="note ok">Challenge set. It stays open for ${CH_DAYS} days.</div>`:''}
    <div class="actions"><button class="btn primary" data-copy>Copy challenge link</button>${fresh?'<button class="btn" data-mine>See my challenges</button>':''}</div><div data-area></div>`;

async function fillMine(el){
  const q=await db.collection('challenges').where('setter','==',user.uid).get();
  const mine=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created?.seconds||0)-(a.created?.seconds||0));
  const taken=attemptsCache.filter(a=>a.uid===user.uid).sort((a,b)=>(b.ts?.seconds||0)-(a.ts?.seconds||0));
  const net=chNet(user.uid,attemptsCache), now=Date.now();
  const setRows=mine.map(c=>{
    const live=c.open&&c.expires>now;
    const cNet=attemptsCache.filter(a=>a.ch===c.id).reduce((s,a)=>s+attemptDelta(a,user.uid),0);
    return `<li class="ch"><div class="ch-top"><strong>Code ${decCode(c.c,c.id)}</strong><span class="stake ${cNet>0?'good':cNet<0?'bad':''}">${signed(cNet)} pts</span></div>
      <div class="ch-meta">Crack it in ${c.target} · stake ${c.stake} · ${c.tries} tried · ${c.cracks} cracked · ${live?timeLeft(c.expires):'closed'}</div>
      <div class="ch-clue">“${esc(chClue(c))}”</div>
      ${live?`<div class="ch-act"><button class="btn small" data-share="${c.id}">Copy link</button><button class="btn small" data-close-ch="${c.id}">Close it</button></div><div data-sharebox="${c.id}"></div>`:''}
    </li>`}).join('');
  const takeRows=taken.map(a=>`<li class="ch"><div class="ch-top"><strong>${esc(a.sname||'A player')}'s code</strong><span class="stake ${a.won?'good':'bad'}">${a.status==='playing'?'in play':signed(a.won?a.stake:-a.stake)+' pts'}</span></div>
      <div class="ch-meta">Target ${a.target} · ${a.won?`cracked in ${a.g.length}${a.secs?` · ${fmtTime(a.secs)}`:''}`:a.status==='playing'?`${a.g.length} guesses so far`:'not cracked'}</div></li>`).join('');
  el.innerHTML=`<div class="nums two"><div><b>${signed(net)}</b><span>Challenge pts</span></div><div><b>${myPoints()}</b><span>Your total</span></div></div>
    <div class="label">Challenges you set</div>${setRows?`<ul class="ch-list">${setRows}</ul>`:'<p class="muted">None yet.</p>'}
    <div class="label">Challenges you took on</div>${takeRows?`<ul class="ch-list">${takeRows}</ul>`:'<p class="muted">None yet.</p>'}`;
  el.querySelectorAll('[data-share]').forEach(b=>b.addEventListener('click',()=>{const c=mine.find(x=>x.id===b.dataset.share);shareChallengeBox(el.querySelector(`[data-sharebox="${c.id}"]`),c,false);el.querySelector(`[data-sharebox="${c.id}"] [data-copy]`).click()}));
  el.querySelectorAll('[data-close-ch]').forEach(b=>b.addEventListener('click',async()=>{
    if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Tap again to close';return}
    b.disabled=true;
    try{await db.collection('challenges').doc(b.dataset.closeCh).update({open:false});toast('Challenge closed');fillChallenges(el)}
    catch(e){console.warn(e);toast('Could not close it. Try again.');b.disabled=false}
  }));
}

function copyText(txt,area,msg){
  const fallback=()=>{area.hidden=false;area.innerHTML='<p class="muted" style="margin-bottom:6px">Copy this text:</p><textarea class="copybox" readonly></textarea>';const ta=area.querySelector('textarea');ta.value=txt;ta.focus();ta.select()};
  try{navigator.clipboard.writeText(txt).then(()=>toast(msg),fallback)}catch(e){fallback()}
}

/* ---------- Result ---------- */
function untilMidnight(){const s=Math.max(0,Math.floor(msToNext()/1000));return [s/3600|0,(s%3600)/60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function shareText(){
  const n=S.remote?S.remote.guesses:S.guesses.length,sc=S.won?n:'X',pts=codePts(n);
  const head=S.mode==='daily'?`Tally No. ${ROUND}  ${sc}/7 · ${pts} pts${S.clueUsed?' · 💡':''}`:
    S.mode==='challenge'?(S.won?`I cracked ${S.ch.setterName}'s Tally challenge in ${n}/${S.max} (+${S.ch.stake} pts)`:`${S.ch.setterName}'s Tally challenge beat me (X/${S.max})`):`Tally practice ${sc}/7`;
  const rows=S.guesses.map(g=>score(g,S.code).state.map(s=>s==='hit'?'🟩':s==='near'?'🟨':'⬜').join(''));
  return [head+(S.secs?` · ⏱ ${fmtTime(S.secs)}`:''),...rows,SITE].join('\n');
}
function showResult(){
  if(S.mode==='challenge'){showChallengeResult();return}
  const n=S.remote?S.remote.guesses:S.guesses.length,pts=codePts(n);
  const answer=[...S.code].map(d=>`<div class="tile ${S.won?'hit':'miss'}"><span class="d">${d}</span><span class="a"></span></div>`).join('');
  const title=S.won?`Cracked in ${n} · ${pts} pts${S.clueUsed&&S.mode==='daily'?' 💡':''}`:'Out of guesses · 0 pts';
  const timeLine=S.secs?`<div class="timeline"><span class="label">Time taken</span><b>${fmtTime(S.secs)}</b></div>`:'';
  let lbNote='';
  if(S.mode==='daily'){
    lbNote=user&&S.posted?`<div class="note ok">Your ${pts} points are on today's leaderboard.</div>`:
      user?`<div class="note">Saving to the leaderboard…</div>`:
      `<div class="note">Pick a nickname to put today's ${pts} points on the leaderboard.</div>${signInHTML()}`;
  }
  openSheet(`<h2>${title}</h2>
  <div><div class="label" style="margin-bottom:8px">The code</div><div class="answer">${answer}</div></div>
  ${timeLine}
  ${lbNote}
  <div class="actions"><button class="btn primary" id="shareBtn">Copy result</button>${S.mode==='daily'?'<button class="btn" id="lbBtn">Leaderboard</button>':''}</div>
  <div id="copyArea"></div>
  ${S.mode==='daily'?installHTML():''}
  <div class="actions"><button class="btn" id="practiceBtn">${S.mode==='daily'?'Practice code':'Play another'}</button>${S.mode==='practice'?`<button class="btn" id="dailyBtn">Back to today's code</button>`:''}</div>
  ${S.mode==='daily'?`<div class="next"><span class="label">Next code in</span><b id="cd">${untilMidnight()}</b></div>`:''}`,
  sh=>{
    sh.querySelector('#shareBtn').addEventListener('click',()=>{
      const txt=shareText();
      const fallback=()=>{const a=sh.querySelector('#copyArea');a.innerHTML='<p class="muted" style="margin-bottom:6px">Copy this text:</p><textarea class="copybox" readonly></textarea>';const ta=a.querySelector('textarea');ta.value=txt;ta.focus();ta.select()};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Result copied. Paste it on Facebook or WhatsApp'),fallback)}catch(e){fallback()}
    });
    const lb=sh.querySelector('#lbBtn');if(lb)lb.addEventListener('click',()=>showBoard('today'));
    sh.querySelector('#practiceBtn').addEventListener('click',()=>{closeSheet();startPractice()});
    const db2=sh.querySelector('#dailyBtn');if(db2)db2.addEventListener('click',()=>{closeSheet();startDaily()});
    mountSignIn(sh,()=>showResult());
    mountInstall(sh);
    if(S.mode==='daily'&&user&&S.won&&S.guesses.length===1){
      const area=document.createElement('div');sh.querySelector('h2').after(area);
      (postP||Promise.resolve()).then(()=>loadLucky(true)).then(l=>{
        const n=l[user.uid]||0;area.innerHTML=n>=LUCKY_HOLD?HOLD_MSG:n>=LUCKY_WARN?WARN_MSG:LUCKY_MSG;
      }).catch(e=>console.warn(e));
    }
    if(S.mode==='daily'){
      tick=setInterval(()=>{const c=$('cd');if(c)c.textContent=untilMidnight()},1000);
      if(user&&!S.posted)postScore().then(()=>{if(modal&&$('cd'))showResult()});
    }
  });
}
